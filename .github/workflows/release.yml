name: Release Python SDK

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate release version and changelog
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import re
          import tomllib

          tag = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Release tags must use vMAJOR.MINOR.PATCH')
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          if project['name'] != 'vortexify' or project['version'] != tag[1:]:
              raise SystemExit('Tag must match the vortexify version in pyproject.toml')
          if f'### {tag}\n' not in Path('README.md').read_text():
              raise SystemExit('Add this version to the README changelog before tagging')
          PYTHON
      - name: Install test and build dependencies
        run: python -m pip install -e '.[dev]' build twine
      - name: Test SDK
        run: python -m pytest
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Create GitHub Release
        run: gh release create "$RELEASE_VERSION" dist/* --verify-tag --generate-notes
