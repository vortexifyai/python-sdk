[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "vortexify"
version = "0.1.0"
description = "Python SDK for the Vortexify platform"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Vortexify" }
]

dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "duckdb==1.5.6",
    "pyspark==4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/vortexifyai/python-sdk"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
